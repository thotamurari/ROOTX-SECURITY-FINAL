<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SafeOpen — AI-Powered Mobile Security Guardian. Protect your digital life with real-time threat detection, behavioral DNA analysis, and community-driven intelligence." />
  <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <title>RootX-Security | AI Guardian</title>
  <script>
    // Apply the persisted theme before first paint to avoid a light/dark flash.
    try {
      var raw = localStorage.getItem('RootX-Security-settings');
      var isDark = raw ? JSON.parse(raw).state.darkMode !== false : true;
      document.documentElement.classList.add(isDark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>

<body class="bg-base text-text-primary font-ui">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
